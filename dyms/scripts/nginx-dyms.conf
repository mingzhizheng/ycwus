# Nginx config for dyms.missgtrading.com
# Copy to /etc/nginx/sites-available/dyms.missgtrading.com

server {
    listen 80;
    server_name dyms.missgtrading.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dyms.missgtrading.com;

    ssl_certificate     /etc/letsencrypt/live/dyms.missgtrading.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dyms.missgtrading.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        client_max_body_size 25M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # Admin frontend (React build)
    location /admin/ {
        alias /opt/dyms/frontend/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Lite frontend (HTML pages)
    location / {
        alias /opt/dyms/frontend/lite/;
        try_files $uri $uri/ /index.html;
        expires 1d;
    }

    # Evidence thumbnails (direct serve)
    location /thumbnails/ {
        alias /opt/dyms/uploads/thumbnails/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    access_log /var/log/nginx/dyms_access.log;
    error_log  /var/log/nginx/dyms_error.log;
}
