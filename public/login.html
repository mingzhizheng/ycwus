<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WMS 登录 - 海外仓退货管理系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.login-card {
  background: #fff; border-radius: 16px; padding: 48px 40px; width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.login-card h1 { text-align: center; color: #333; margin-bottom: 8px; font-size: 24px; }
.login-card .subtitle { text-align: center; color: #888; margin-bottom: 32px; font-size: 14px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; font-weight: 500; }
.form-group input {
  width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px;
  font-size: 15px; transition: border-color .2s;
}
.form-group input:focus { outline: none; border-color: #667eea; }
.btn-login {
  width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
  cursor: pointer; transition: opacity .2s;
}
.btn-login:hover { opacity: 0.9; }
.btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
.error-msg { color: #e74c3c; text-align: center; margin-top: 16px; font-size: 14px; min-height: 20px; }
</style>
</head>
<body>
<div class="login-card">
  <h1>海外仓退货管理</h1>
  <p class="subtitle">Warehouse Returns Management System</p>
  <form id="loginForm">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login" id="btnLogin">登 录</button>
  </form>
  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
const API = window.location.origin;

// If already logged in, redirect
const token = localStorage.getItem('token');
if (token) {
  fetch(API + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => redirectByRole(data.user.role))
    .catch(() => localStorage.removeItem('token'));
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const errEl = document.getElementById('errorMsg');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '登录中...';

  try {
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '登录失败');

    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    redirectByRole(data.user.role);
  } catch (err) {
    errEl.textContent = err.message;
    btn.disabled = false;
    btn.textContent = '登 录';
  }
});

function redirectByRole(role) {
  if (role === 'customer') window.location.href = '/portal.html';
  else window.location.href = '/ops.html';
}
</script>
</body>
</html>
